[project]
name = "blynclight-teams"
version = "0.1.0"
description = "Show Microsoft Teams presence on an Embrava Blynclight under Linux"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
blynclight-teams = "blynclight_teams.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
